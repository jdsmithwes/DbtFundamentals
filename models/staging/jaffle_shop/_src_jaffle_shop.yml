sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    description: A clone of a Postgres application database.
    tables:
      - name: customers
        description: Raw customer data
        columns:
          - name: id
            description: Primary key for the customer data
            data_tests:
              - unique
              - not_null
                   
      - name: orders
        description: Raw orders data
        columns:
          - name: id
            description: Primary key for the orders data
            data_tests:
              - unique
              - not_null
              
              

  - name: stripe
    database: raw
    schema: stripe
    tables:
      - name: payment